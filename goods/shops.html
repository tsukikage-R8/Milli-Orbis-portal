.goods-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}

<body data-oshi="">
<header id="siteHeader"><div class="header-inner"><a class="logo" href="../index.html"><img src="../images/rogo/Milli%20Orbis-rogo.png" alt="Milli Orbis"></a>

<main class="container" style="padding-top:84px">
<nav class="breadcrumb"><a href="../index.html">Home</a><span>グッズ</span><span>販売箇所検索</span></nav>
<section class="subpage-hero"><h1 style="font-family:var(--font-display);font-weight:900">販売箇所検索</h1><p class="section-sub" style="padding-left:0">都道府県を選ぶと、その地域でミリプログッズを売っている店が表示されます。ミリプロオフィシャルショップは全県で表示。</p></section>
<nav class="goods-tabs"><a href="current.html">現在販売中</a><a href="shops.html" class="active">販売箇所検索</a><a href="map.html">有志マップ</a><a href="archive.html">過去アーカイブ</a><a href="mine.html">マイグッズ</a></nav>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><select id="chainSel"><option value="">全チェーン</option><option value="official">公式ショップ</option><option value="animate">アニメイト</option><option value="aeon">イオン</option></select><input type="search" id="kw" placeholder="店舗名で検索" style="flex:1;min-width:160px;padding:8px 12px;border-radius:999px;border:2px solid var(--accent)"><button id="clearPref" class="btn btn-ghost" style="padding:6px 12px">都道府県クリア</button></div>
<div id="prefGrid" class="pref-grid"></div>
<div id="shopList" class="shop-list"></div>
<p style="margin:14px 0;color:var(--muted);font-size:.78rem">住所・在庫は各店舗へお問い合わせください。オンラインショップは <a href="https://shop.milpr.com/" target="_blank">shop.milpr.com</a></p>
</main>
<footer><p class="disclaimer">本サイトはファンが運営する非公式のポータルサイトです。</p></footer>
<script src="../data.js"></script><script src="../data/i18n.js"></script><script src="../scripts/i18n.js"></script><script src="../scripts/fav-store.js"></script><script src="../scripts/cursor.js"></script><script src="../script.js"></script>
<script>
(function(){
  var prefs=["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
  var grid=document.getElementById("prefGrid"), list=document.getElementById("shopList"), chainSel=document.getElementById("chainSel"), kw=document.getElementById("kw"), clear=document.getElementById("clearPref");
  var selPref="";
  prefs.forEach(function(p){ var b=document.createElement("button"); b.className="pref-btn"; b.textContent=p; b.onclick=function(){ selPref= selPref===p?"":p; render(); }; grid.appendChild(b); });
  function render(){
    document.querySelectorAll(".pref-btn").forEach(function(b){ b.classList.toggle("active", b.textContent===selPref); });
    fetch("../data/shops.json").then(function(r){return r.json()}).then(function(data){
      var filtered=data.filter(function(s){
        if(chainSel.value && s.chain!==chainSel.value) return false;
        if(selPref && s.prefecture!=="全国" && s.prefecture!==selPref) return false;
        if(kw.value && s.name.indexOf(kw.value)===-1) return false;
        return true;
      });
      // official always on top, then chain
      filtered.sort(function(a,b){ if(a.chain==="official"&&b.chain!=="official") return -1; if(b.chain==="official"&&a.chain!=="official") return 1; return a.prefecture.localeCompare(b.prefecture); });
      list.innerHTML=filtered.map(function(s){
        return '<div class="shop-card card"><h3>'+s.name+'<span class="chain-badge">'+s.chainLabel+'</span></h3><div style="font-size:.78rem;color:var(--muted)">'+(s.prefecture==="全国"?"全国（オンライン）":s.prefecture+'・'+(s.address||""))+'</div><div style="font-size:.74rem;margin-top:4px">'+(s.collab||"")+' '+(s.period? '期間: '+s.period.from+'〜'+(s.period.to||""):"")+'</div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><a class="btn btn-ghost" style="padding:6px 10px;font-size:.76rem" href="'+s.gmapsUrl+'" target="_blank" rel="noopener">地図を開く</a>'+(s.chain==="official"? '<a class="btn" style="padding:6px 10px;font-size:.76rem" href="current.html">グッズを見る</a>':'')+'</div></div>';
      }).join("") || '<div class="placeholder" style="grid-column:1/-1">該当する店舗がありません</div>';
    });
  }
  chainSel.addEventListener("change", render); kw.addEventListener("input", render); clear.addEventListener("click", function(){ selPref=""; kw.value=""; chainSel.value=""; render(); });
  render();
})();
</script>
</body>
</html>
