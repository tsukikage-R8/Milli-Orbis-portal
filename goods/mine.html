<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイグッズ | Milli Orbis</title><meta name="description" content="自分の持っているグッズを登録して所持率を可視化。want/haveで譲求メモも。">
<link rel="icon" href="../images/icon/Milli%20Orbis.ico"><meta name="theme-color" content="#75b1c0">
<script>try{if(localStorage.getItem("milli-theme")==="dark"||(!localStorage.getItem("milli-theme")&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark";}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
.goods-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.goods-tabs a{padding:9px 16px;border-radius:999px;border:2px solid var(--border);background:#fff;font-weight:800;font-size:.86rem;color:var(--text);text-decoration:none}
.goods-tabs a.active{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
.mine-bar{padding:12px;border-radius:16px;background:rgba(255,255,255,.8);border:2px dashed var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mine-card{padding:10px}
.mine-actions{display:flex;gap:6px;margin-top:8px}
.mine-btn{flex:1;padding:6px;border-radius:999px;border:2px solid var(--border);background:#fff;font-weight:800;font-size:.74rem;cursor:pointer}
.mine-btn.on{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
.progress{height:14px;border-radius:999px;background:#eee;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--accent);width:0%}
</style>
</head>
<body data-oshi="">
<header id="siteHeader"><div class="header-inner"><a class="logo" href="../index.html"><img src="../images/rogo/Milli%20Orbis-rogo.png" alt="Milli Orbis"></a>
<nav class="nav"><a href="../index.html#home">Home</a><a href="current.html" class="current">グッズ</a></nav>
<div class="header-actions"><button type="button" class="profile-btn" id="profile-btn" onclick="mpOpenAccount()"><span class="profile-icon" id="profile-header-icon">?</span></button><div class="oshi-cursor-wrap" id="oshiCursorWrap"><button id="oshiCursorBtn" class="oshi-cursor-btn"><span id="oshiCursorPreview" class="oshi-cursor-preview" style="width:18px;height:18px;border-radius:50%;background:#7a4fc4;border:2px solid #fff;display:inline-block"></span><span id="oshiDot" class="oshi-dot" style="width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;display:inline-block"></span></button><div id="oshiCursorDropdown" class="oshi-cursor-dropdown"></div></div><select id="oshiSelect" class="oshi-select" style="display:none"></select><button id="hamburger" class="hamburger"><svg viewBox="0 0 28 20" width="30" height="22"><path d="M2 3h24M2 10h24M2 17h24" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg></button></div></div><div id="drawerBackdrop" class="drawer-backdrop"></div><nav id="mobileNav" class="mobile-nav"><a href="current.html">現在販売中</a><a href="shops.html">販売箇所検索</a><a href="map.html">有志マップ</a><a href="archive.html">過去アーカイブ</a><a href="mine.html">マイグッズ</a></nav></header>
<main class="container" style="padding-top:84px">
<nav class="breadcrumb"><a href="../index.html">Home</a><span>グッズ</span><span>マイグッズ</span></nav>
<section class="subpage-hero"><h1 style="font-family:var(--font-display);font-weight:900">マイグッズ</h1><p class="section-sub" style="padding-left:0">持っているグッズを登録して、所持率と未所持を見える化。譲求はwant/haveメモ＋定型文生成まで。</p></section>
<nav class="goods-tabs"><a href="current.html">現在販売中</a><a href="shops.html">販売箇所検索</a><a href="map.html">有志マップ</a><a href="archive.html">過去アーカイブ</a><a href="mine.html" class="active">マイグッズ</a></nav>
<div class="mine-bar">
<span id="stat" style="font-weight:900"></span>
<div class="progress" style="min-width:140px"><i id="bar"></i></div>
<select id="fMember"><option value="">全タレント</option></select>
<label style="font-weight:800"><input type="checkbox" id="oshiOnly"> 推しのみ</label>
<button id="shareBtn" class="btn" style="padding:6px 12px;font-size:.8rem">Xで共有</button>
<button id="clearBtn" class="btn btn-ghost" style="padding:6px 12px;font-size:.8rem">全クリア</button>
</div>
<div id="grid" class="mine-grid" style="margin-top:12px"></div>
</main>
<footer><p class="disclaimer">非公式ファンサイトです。</p></footer>
<script src="../data.js"></script><script src="../data/goods-archive.js"></script><script src="../data/i18n.js"></script><script src="../scripts/i18n.js"></script><script src="../scripts/fav-store.js"></script><script src="../scripts/cursor.js"></script><script src="../script.js"></script>
<script>
(function(){
  var KEY="milli-goods-mine";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var store=load();
  var fM=document.getElementById("fMember"), oshiOnly=document.getElementById("oshiOnly"), grid=document.getElementById("grid"), stat=document.getElementById("stat"), bar=document.getElementById("bar");
  MEMBERS.forEach(function(m){ var o=document.createElement("option"); o.value=m.id; o.textContent=m.name; fM.appendChild(o); });
  function allGoods(){ var a=[].concat(GOODS); if(typeof GOODS_ARCHIVE!=="undefined") a=a.concat(GOODS_ARCHIVE); return a; }
  function tile(g){ if(g.image) return '<img src="'+g.image+'" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:12px" onerror="this.style.display=\'none\'">'; return '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--gc)">'+(GOODS_ICON[g.kind]||"?")+'</div>'; }
  function render(){
    var oshi=""; try{ oshi=localStorage.getItem("milli-oshi")||"";}catch(e){}
    var fm=fM.value, of=oshiOnly.checked;
    var list=allGoods().filter(function(g){ if(fm && g.memberId!==fm) return false; if(of && oshi && g.memberId!==oshi && g.memberId!=="") return false; return true; });
    var have=list.filter(function(g){ return store[g.id]==="have"; }).length;
    var total=list.length;
    stat.textContent="所持 "+have+" / "+total+" ("+(total? Math.round(have/total*100):0)+"%)";
    bar.style.width=(total? (have/total*100):0)+"%";
    bar.style.background= oshi? (MEMBERS.find(function(m){return m.id===oshi})||{color:"#75b1c0"}).color : "var(--accent)";
    grid.innerHTML=list.map(function(g){
      var m=g.memberId? MEMBERS.find(function(x){return x.id===g.memberId}):null;
      var color=m? m.color:"#75b1c0";
      var st=store[g.id]||"";
      return '<div class="card mine-card" style="--gc:'+color+'"><div style="height:120px;border-radius:12px;overflow:hidden;background:linear-gradient(160deg, color-mix(in srgb, var(--gc) 18%, #fff), #fff);display:flex;align-items:center;justify-content:center">'+tile(g)+'</div><div style="font-size:.82rem;font-weight:900;margin-top:6px">'+g.name+'</div><div style="font-size:.72rem;color:var(--muted)">'+(m? m.name: g.memberLabel||"全員")+'・'+(g.category||g.kind)+'</div><div class="mine-actions"><button class="mine-btn '+(st==="have"?'on':'')+'" data-id="'+g.id+'" data-v="have">持ってる</button><button class="mine-btn '+(st==="want"?'on':'')+'" data-id="'+g.id+'" data-v="want">欲しい</button><button class="mine-btn '+(st==="have"? '':'')+'" data-id="'+g.id+'" data-v="">クリア</button></div></div>';
    }).join("");
  }
  grid.addEventListener("click", function(e){
    var b=e.target.closest(".mine-btn"); if(!b) return;
    var id=b.dataset.id, v=b.dataset.v;
    if(v) store[id]=v; else delete store[id];
    save(store); render();
  });
  fM.addEventListener("change", render); oshiOnly.addEventListener("change", render);
  document.getElementById("shareBtn").addEventListener("click", function(){
    var oshi=""; try{ oshi=localStorage.getItem("milli-oshi")||"";}catch(e){}
    var m=oshing? MEMBERS.find(function(x){return x.id===oshi}):null;
    var txt="マイグッズ所持率 "+stat.textContent+" #MilliOrbis #ミリプロ";
    window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(txt)+"&url="+encodeURIComponent(location.href),"_blank");
  });
  document.getElementById("clearBtn").addEventListener("click", function(){ if(confirm("全ての登録をクリアしますか？")){ store={}; save(store); render(); } });
  render();
})();
</script>
</body>
</html>
