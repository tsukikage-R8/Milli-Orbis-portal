<div class="legend">タイル: OpenStreetMap / 地理院地図（出典明記）。提供は <a href="#" id="formLink" target="_blank">Google Form（準備中）</a> から。運営が1日1回精査して反映（PRレビュー）。</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="../data.js"></script><script src="../data/i18n.js"></script><script src="../scripts/i18n.js"></script><script src="../scripts/fav-store.js"></script><script src="../scripts/cursor.js"></script><script src="../script.js"></script>
<script>
(function(){
  var map=L.map('map', { minZoom:4, maxZoom:18 }).setView([36.2,138.0],5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap contributors / 地理院地図', maxZoom:18 }).addTo(map);
  // optional GSI switch: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {attribution:'地理院地図'} )
  var cluster=L.markerClusterGroup();
  fetch('../data/sightings.json').then(function(r){return r.json()}).then(function(data){
    var approved=data.filter(function(d){return d.status==="approved" && d.lat && d.lng;});
    approved.forEach(function(d){
      var m=d.memberId? MEMBERS.find(function(x){return x.id===d.memberId}):null;
      var color=m? m.color : "#75b1c0";
      var icon=L.divIcon({ html:'<span style="width:14px;height:14px;border-radius:50%;background:'+color+';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:block"></span>', className:'', iconSize:[14,14] });
      var mk=L.marker([d.lat,d.lng], {icon:icon});
      mk.bindPopup('<b>'+d.place+'</b><br>'+d.item+'<br><span style="font-size:.78rem;color:#6f6250">'+d.date+' / '+(d.prefecture||"")+'</span><br><a href="'+(d.gmapsUrl|| "https://www.google.com/maps/search/"+encodeURIComponent(d.place))+'" target="_blank">地図を開く</a> <a href="current.html" style="margin-left:6px">グッズを見る</a><br><span style="font-size:.68rem;color:#c0392b">目撃時点の情報。在庫は店舗へお問い合わせください。</span>');
      cluster.addLayer(mk);
    });
    map.addLayer(cluster);
    // list below map
    var list=document.getElementById("list");
    list.innerHTML=approved.map(function(d){ return '<div class="card" style="padding:10px"><b>'+d.place+'</b><div style="font-size:.78rem;color:var(--muted)">'+d.prefecture+'・'+d.date+'</div><div style="font-size:.82rem">'+d.item+'</div><a href="'+(d.gmapsUrl|| "https://www.google.com/maps/search/"+encodeURIComponent(d.place))+'" target="_blank" class="btn btn-ghost" style="padding:4px 10px;font-size:.74rem;margin-top:6px">地図</a></div>'; }).join("");
    if(approved.length) map.fitBounds(cluster.getBounds().pad(0.2));
  });
})();
</script>
