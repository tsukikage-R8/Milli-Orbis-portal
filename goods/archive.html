<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
.goods-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.goods-tabs a{padding:9px 16px;border-radius:999px;border:2px solid var(--border);background:#fff;font-weight:800;font-size:.86rem;color:var(--text);text-decoration:none}
.goods-tabs a.active{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
.goods-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0;padding:14px;background:rgba(255,255,255,.7);border:2px dashed var(--border);border-radius:16px}
.goods-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}

</head>
<body data-oshi="">
<header id="siteHeader"><div class="header-inner"><a class="logo" href="../index.html"><img src="../images/rogo/Milli%20Orbis-rogo.png" alt="Milli Orbis"></a>
<nav class="nav"><a href="../index.html#home">Home</a><a href="current.html" class="current">グッズ</a></nav>
<div class="header-actions"><button type="button" class="profile-btn" id="profile-btn" onclick="mpOpenAccount()"><span class="profile-icon" id="profile-header-icon">?</span></button><div class="oshi-cursor-wrap" id="oshiCursorWrap"><button id="oshiCursorBtn" class="oshi-cursor-btn"><span id="oshiCursorPreview" class="oshi-cursor-preview" style="width:18px;height:18px;border-radius:50%;background:#7a4fc4;border:2px solid #fff;display:inline-block"></span><span id="oshiDot" class="oshi-dot" style="width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;display:inline-block"></span></button><div id="oshiCursorDropdown" class="oshi-cursor-dropdown"></div></div><select id="oshiSelect" class="oshi-select" style="display:none"></select><button id="hamburger" class="hamburger"><svg viewBox="0 0 28 20" width="30" height="22"><path d="M2 3h24M2 10h24M2 17h24" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg></button></div></div><div id="drawerBackdrop" class="drawer-backdrop"></div><nav id="mobileNav" class="mobile-nav"><a href="current.html">現在販売中</a><a href="shops.html">販売箇所検索</a><a href="map.html">有志マップ</a><a href="archive.html">過去アーカイブ</a><a href="mine.html">マイグッズ</a></nav></header>
<main class="container" style="padding-top:84px">
<nav class="breadcrumb"><a href="../index.html">Home</a><span>グッズ</span><span>過去アーカイブ</span></nav>
<section class="subpage-hero"><h1 style="font-family:var(--font-display);font-weight:900">過去アーカイブ</h1><p class="section-sub" style="padding-left:0">これまで販売されたグッズを可能な限り網羅。画像はホットリンク、失効時はSVGで表示。</p><p class="cmp-disclaimer">有志による追加依頼は下部のFormから。運営が確認後に反映（PRレビュー）。</p></section>
<nav class="goods-tabs"><a href="current.html">現在販売中</a><a href="shops.html">販売箇所検索</a><a href="map.html">有志マップ</a><a href="archive.html" class="active">過去アーカイブ</a><a href="mine.html">マイグッズ</a></nav>
<div class="goods-filters"><input type="search" id="q" placeholder="グッズ名で検索" style="flex:1;min-width:180px;padding:9px 12px;border-radius:999px;border:2px solid var(--accent)"><select id="fMember"><option value="">全タレント</option></select><select id="fKind"><option value="">全種類</option></select><select id="fCategory"><option value="">全カテゴリ</option></select></div>
<div id="grid" class="goods-grid"></div>
<p style="margin:16px 0;text-align:center"><a class="btn" href="#" id="formLink2" target="_blank">過去グッズの追加を依頼する（Form）</a></p>
</main>
<footer><p class="disclaimer">非公式ファンサイトです。</p></footer>
<script src="../data.js"></script><script src="../data/goods-archive.js"></script><script src="../data/i18n.js"></script><script src="../scripts/i18n.js"></script><script src="../scripts/fav-store.js"></script><script src="../scripts/cursor.js"></script><script src="../script.js"></script>
<script>
(function(){
  var all=[].concat(GOODS).concat(typeof GOODS_ARCHIVE!=="undefined"? GOODS_ARCHIVE:[]);
  // archive = status archived or period.to < now and not permanent
  var now=new Date();
  var arch=all.filter(function(g){ if(g.status==="archived") return true; if(g.permanent) return false; if(g.period && g.period.orderTo && new Date(g.period.orderTo) < now) return true; return false; });
  var q=document.getElementById("q"), fM=document.getElementById("fMember"), fK=document.getElementById("fKind"), fC=document.getElementById("fCategory"), grid=document.getElementById("grid");
  MEMBERS.forEach(function(m){ var o=document.createElement("option"); o.value=m.id; o.textContent=m.name; fM.appendChild(o); });
  var kinds=[...new Set(arch.map(function(g){return g.kind}))]; kinds.forEach(function(k){ var o=document.createElement("option"); o.value=k; o.textContent=k; fK.appendChild(o); });
  var cats=[...new Set(arch.map(function(g){return g.category}).filter(Boolean))]; cats.forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=c; fC.appendChild(o); });
  function tile(g){ if(g.image) return '<img src="'+g.image+'" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;color:var(--gc)">'+(GOODS_ICON[g.kind]||"?")+'</div>'; return GOODS_ICON[g.kind]||""; }
  function render(){
    var kw=(q.value||"").toLowerCase().trim(), fm=fM.value, fk=fK.value, fc=fC.value;
    var list=arch.filter(function(g){ if(fm && g.memberId!==fm) return false; if(fk && g.kind!==fk) return false; if(fc && g.category!==fc) return false; if(kw && g.name.toLowerCase().indexOf(kw)===-1) return false; return true; });
    list.sort(function(a,b){ var da=a.period&&a.period.orderTo? new Date(a.period.orderTo):0; var db=b.period&&b.period.orderTo? new Date(b.period.orderTo):0; return db-da; });
    grid.innerHTML=list.map(function(g){ var m=g.memberId? MEMBERS.find(function(x){return x.id===g.memberId}):null; var label=m? m.name: (g.memberLabel||"全員"); var color=m? m.color:"#75b1c0"; return '<a class="goods-card card" href="'+g.url+'" target="_blank" rel="noopener" style="--gc:'+color+'"><span class="goods-tile">'+tile(g)+'</span><span class="goods-body"><span class="goods-member">'+label+'</span><span class="goods-name">'+g.name+'</span><span style="font-size:.74rem;color:var(--muted)">'+(g.period? g.period.orderFrom+"〜"+g.period.orderTo:"")+'</span><span class="btn btn-ghost" style="margin-top:6px;justify-content:center">公式ページへ</span></span></a>'; }).join("") || '<div class="placeholder" style="grid-column:1/-1">該当なし（データ拡充中）</div>';
  }
  [q,fM,fK,fC].forEach(function(el){ el.addEventListener("input", render); el.addEventListener("change", render); });
  render();
})();
</script>
</body>
</html>
