name: Karaoke Shazam Analyze

on:
  workflow_run:
    workflows: ["Fetch YouTube Data"]
    types: [completed]
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  group: karaoke-shazam
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install -q -r tools/requirements-identify.txt

      - name: Analyze karaoke streams
        run: python tools/analyze-karaoke.py --max-videos 3 --max-minutes 90
        env:
          KARAOKE_COOKIES: ${{ secrets.KARAOKE_COOKIES }}

      - name: Commit and push
        run: |
          git config user.name "Milli Orbis Bot"
          git config user.email "bot@milliorbis.local"
          git add data/karaoke-shazam.js
          git diff --cached --quiet || git commit -m "chore: update karaoke shazam results"
          git push