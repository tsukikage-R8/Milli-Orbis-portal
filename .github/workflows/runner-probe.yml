name: Runner Probe (yt-dlp reachability)

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -q yt-dlp imageio-ffmpeg

      - name: Probe
        shell: bash
        run: |
          FFMPEG_BIN=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p probe-bin
          cp "$FFMPEG_BIN" "probe-bin/ffmpeg$(python -c "import sys;print('.exe' if sys.platform=='win32' else '')")"
          export PATH="$PWD/probe-bin:$PATH"
          python tools/identify-song.py "https://www.youtube.com/watch?v=jNQXAC9IVRw" --max-duration 10 2>&1 | tail -6
          echo "PROBE_EXIT=$?"